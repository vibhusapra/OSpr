name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ospr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install media decoder for real codec and track-mixing tests
        run: brew install ffmpeg
      - name: Verify native app and core contracts
        run: |
          /usr/bin/sqlite3 --version
          swift test
          swiftc -typecheck -parse-as-library -I .build/debug/Modules benchmarks/edited_summary_storage.swift
          swiftc -typecheck -parse-as-library -I .build/debug/Modules benchmarks/history_archive_reader.swift
          swiftc -typecheck -parse-as-library -I .build/debug/Modules benchmarks/refinement_guard.swift
          swiftc -typecheck -swift-version 5 -parse-as-library Sources/OSprCore/WorkerClient.swift benchmarks/native_stream_stop.swift
          swiftc -typecheck -swift-version 5 -parse-as-library Sources/OSprCore/WorkerClient.swift Sources/OSprCore/StreamingSpeechResampler.swift benchmarks/resampling_quality.swift
      - name: Typecheck Apple speech research helper when the SDK supports it
        run: |
          speech_sdk_version="$(xcrun --show-sdk-version)"
          if (( ${speech_sdk_version%%.*} >= 26 )); then
            swiftc -typecheck -swift-version 5 -parse-as-library benchmarks/apple_speech.swift
          else
            echo "Apple speech research requires SDK 26; local macOS 26 compile and real-ASR receipts are recorded separately."
          fi
      - name: Install locked Python environment
        run: uv sync --frozen --all-extras --python 3.12
      - name: Lint and backend protocol tests
        run: |
          uv run --frozen --all-extras ruff check backend benchmarks scripts
          uv run --frozen --all-extras pytest -q
          task_directory="$(mktemp -d)"
          (cd "$task_directory" && "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/benchmarks/native_long.py" --help)
          uv run --frozen --all-extras python benchmarks/preview_package_gates.py --help
          uv run --frozen --all-extras python benchmarks/preview_package_verify.py --help
          uv run --frozen --all-extras python benchmarks/context_profiles.py --cli .build/debug/ospr-cli
          uv run --frozen --all-extras python benchmarks/gemini_contracts.py --cli .build/debug/ospr-cli --output /tmp/ospr-gemini-contracts.json
          uv run --frozen --all-extras python benchmarks/azure_contracts.py --cli .build/debug/ospr-cli --output /tmp/ospr-azure-contracts.json
          uv run --frozen --all-extras python benchmarks/rewrite_completion_contracts.py --cli .build/debug/ospr-cli --output /tmp/ospr-rewrite-completion-contracts.json
          uv run --frozen --all-extras python benchmarks/meeting_summary_cli.py --cli .build/debug/ospr-cli --output /tmp/ospr-summary-contracts.json --contracts-only
          uv run --frozen --all-extras python benchmarks/local_model_cli.py --cli .build/debug/ospr-cli --output /tmp/ospr-local-model-contracts.json --contracts-only
          uv run --frozen --all-extras python benchmarks/text_preparation_contracts.py --cli .build/debug/ospr-cli --output /tmp/ospr-text-preparation-contracts.json
      - name: Build app and self-contained research report
        run: |
          scripts/build-app.sh
          python3 scripts/build-report.py
      - name: Verify standalone runtime on a clean runner
        run: |
          scripts/bundle-app.sh
          uv run --frozen --all-extras python -c 'from pathlib import Path; from benchmarks.portable_app import verify_help_links; print("Bundled help links verified:", verify_help_links(Path("dist/standalone/OSpr.app")))'
          bundle="$GITHUB_WORKSPACE/dist/standalone/OSpr.app"
          task_directory="$(mktemp -d)"
          cd "$task_directory"
          "$bundle/Contents/Resources/Engine/.venv/bin/python" -c 'import mlx.core as mx; mx.set_default_device(mx.cpu); import mlx_whisper, parakeet_mlx, mlx_audio.stt, mlx_lm, mcp; value = mx.array([1]); mx.eval(value + 1); print("Bundled inference libraries imported successfully")'
          "$bundle/Contents/MacOS/ospr-cli" doctor
          "$bundle/Contents/MacOS/ospr-cli" benchmark-history-session 100
          codesign --verify --deep --strict "$bundle"
      - name: Preserve executable bits and symlinks inside the development artifact
        run: ditto -c -k --sequesterRsrc --keepParent dist/OSpr.app dist/OSpr-development.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OSpr-development-build
          path: |
            dist/OSpr-development.zip
            docs/research.html
